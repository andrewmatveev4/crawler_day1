<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Отчёт краулера</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        table { border-collapse: collapse; margin: 10px 0; }
        td, th { border: 1px solid #ccc; padding: 6px 12px; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Отчёт краулера</h1>
    <p>Всего страниц: <b>10</b></p>
    <p>Успешно: <b>10</b> | Ошибок: <b>0</b></p>
    <p>Время работы: <b>5.6s</b> | Скорость: <b>1.79 стр/сек</b></p>

    <h2>Статус-коды</h2>
    <table><tr><th>Код</th><th>Кол-во</th></tr><tr><td>200</td><td>10</td></tr></table>

    <h2>Топ доменов</h2>
    <table><tr><th>Домен</th><th>Страниц</th></tr><tr><td>books.toscrape.com</td><td>10</td></tr></table>
</body>
</html>
